name: eventplatform-local

# Local development backing services. No Azure required — this is the full stack
# for local dev. Bring it up with:  docker compose up -d
#
# Ports:
#   Postgres  localhost:5432
#   Redis     localhost:6380   (6379 is left free for Dapr's own runtime)
#   Jaeger UI http://localhost:16686   (OTLP ingest on 4317/4318)
#   Azurite   localhost:10000  (blob only — Media.Api's local storage emulator)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventplatform
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: eventplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (services export traces here)
      - "4318:4318"     # OTLP HTTP

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # --skipApiVersionCheck: the pinned Azure.Storage.Blobs SDK sends a newer x-ms-version than
    # this Azurite build recognizes ("API version ... is not supported by Azurite"), since Azurite
    # trails the newest Azure REST API releases. Local-emulator-only flag — real Azure Blob Storage
    # in prod has no such check to skip.
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"

volumes:
  pgdata:
