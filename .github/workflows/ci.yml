name: CI

on:
  push:
    branches: ["**"]
    # cd.yml's tag-bump commits only ever touch this path - excluding it here
    # (on top of that commit's own [skip ci] trailer) stops the CI-retrigger
    # loop ADR-0004 calls out: bot commit -> CI -> CD workflow_run -> bot
    # commit -> ...
    paths-ignore:
      - "deploy/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (warnings = errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before the build, because it needs no toolchain and answers a question the compiler cannot:
      # an endpoint with no authorization metadata compiles perfectly and is reachable by anyone.
      # The deny-by-default fallback policy (ADR-0035) now closes that, but it closes it at runtime
      # — and for a health probe or a Dapr subscriber, failing closed is its own outage. This step
      # is where a missing decision is supposed to be caught.
      - name: Check endpoint authorization
        run: python3 scripts/check-endpoint-auth.py

      # Also before the build, and for the same reason: no toolchain needed. This one is not
      # answering a question the compiler cannot — it is answering the same questions *faster*.
      # `dotnet build` stops at the first failing project, so a run surfaces one project's errors
      # at a time; this checks every file at once. Only rules calibrated to zero false positives
      # on the tree live here (see the script's docstring).
      - name: Check C# style
        run: python3 scripts/check-csharp-style.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EventPlatform.slnx

      - name: Build
        run: dotnet build EventPlatform.slnx --no-restore -c Release

      - name: Test
        run: dotnet test EventPlatform.slnx --no-build -c Release

      # The one weakness ADR-0029 leaves open: the model is the source of truth and migrations are
      # generated from it, so nothing otherwise stops a model change merging without the migration
      # that carries it into a real database. Inert for any service with no migrations committed
      # yet — see the script for why "never migrated" is not the same as "drifted".
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Check for model drift
        run: ./scripts/db-check-drift.sh

  # Terraform and the Kubernetes manifests were, until this job existed, the only things in the
  # repo nothing machine-checked: several passes of infra work were verified by reading them
  # carefully and running `terraform fmt`, which catches whitespace and nothing else. `validate`
  # resolves every resource's schema and every module's variables; `kustomize build` resolves the
  # whole overlay, so a patch that targets nothing or a resource that isn't listed fails here
  # rather than at Argo CD sync time.
  #
  # Neither step reaches Azure or a cluster — no credentials, no state, no plan. This says the
  # configuration is well-formed, not that applying it does what you meant.
  #
  # Note the workflow-level `paths-ignore: deploy/**` above: a push touching ONLY deploy/ skips
  # this job. That exclusion exists to break the CD tag-bump loop (ADR-0004) and is worth keeping,
  # but it means a manifests-only push is checked at pull-request time rather than on push.
  infrastructure:
    name: infrastructure (terraform + manifests)
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: '5.5.0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          # The wrapper rewrites stdout, which makes a failure here harder to read than it needs
          # to be. These steps only need the binary.
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra/

      # Only the two root modules are validated, which is sufficient: each pulls in every leaf
      # module it uses via a `module` block, and validation follows them. `-backend=false` because
      # neither backend is reachable from CI — dev's is an Azure storage account, and bootstrap's
      # is the local state file that creates it.
      - name: Validate infra/bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate infra/environments/dev
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up kustomize
        run: |
          curl -sSLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # Building the overlay exercises the base too, plus every patch, generator and image
      # placeholder. Output is discarded — a non-zero exit is the whole signal.
      - name: Build dev overlay
        run: kustomize build deploy/overlays/dev > /dev/null

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
