apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "identity"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        # Sends the sidecar's own spans to the collector — see deploy/base/observability.
        dapr.io/config: "tracing"
    spec:
      containers:
        - name: identity
          image: identity-placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventplatform-config
          env:
            - name: ConnectionStrings__identity
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: identity-connection-string
          # No Jwt__DevSigningKey — Identity is a token ISSUER, not a validator, of inbound
          # buyer tokens; its own OTP/discovery/JWKS endpoints are all .AllowAnonymous().
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eventplatform-keyvault
