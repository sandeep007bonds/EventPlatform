apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
      # No dapr.io/* annotations — the gateway is a plain HTTP proxy, never a
      # Dapr participant (see gateways/EventPlatform.Gateway/CLAUDE.md). It
      # reaches the 6 backend services directly via their K8s Service DNS
      # names (http://catalog, http://inventory, ...), which is exactly what
      # appsettings.json's base ReverseProxy config already points at.
    spec:
      containers:
        - name: gateway
          image: gateway-placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            # Deliberately NOT "Development": appsettings.Development.json
            # overrides every ReverseProxy cluster address to localhost:508x
            # for the local dev-up.sh flow, which would break in-cluster
            # routing. "Staging" skips that file (avoiding the bad override)
            # while still avoiding the Production fail-fast guard that refuses
            # to start with Jwt:DevSigningKey set — so dev-login keeps working.
            - name: ASPNETCORE_ENVIRONMENT
              value: "Staging"
            - name: Jwt__DevSigningKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: jwt-dev-signing-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eventplatform-keyvault
