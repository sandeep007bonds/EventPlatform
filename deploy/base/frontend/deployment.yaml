apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
      # No dapr.io/* annotations: this is nginx serving static files. It never calls a service
      # from the server side — the browser does, through the ingress.
    spec:
      containers:
        - name: frontend
          image: frontend-placeholder
          ports:
            - name: http
              containerPort: 8080
          # No env and no secrets-store volume, unlike every other pod here. Vite inlines its
          # configuration at build time, so there is nothing to inject at runtime — and anything
          # this container could read would be shipped to the browser anyway, which is the wrong
          # place for a secret. The CSI mount is unnecessary too: ten other pods already mount the
          # SecretProviderClass, which is what keeps eventplatform-secrets synced.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
