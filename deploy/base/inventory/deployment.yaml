apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "inventory"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        # Sends the sidecar's own spans to the collector — see deploy/base/observability.
        dapr.io/config: "tracing"
    spec:
      containers:
        - name: inventory
          image: inventory-placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventplatform-config
          env:
            - name: ConnectionStrings__inventory
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: inventory-connection-string
            - name: Jwt__DevSigningKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: jwt-dev-signing-key
            # Direct StackExchange.Redis connection for the hold hot path — this
            # bypasses Dapr entirely (RedisHoldStore's Lua atomic check-and-set),
            # separate from the Dapr statestore/pubsub components.
            - name: ConnectionStrings__redis
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: redis-connection-string
            # Shared secret with the Queue service — verifies an admission token locally,
            # with no call back to Queue at hold-placement time (ADR-0026).
            - name: QueueAdmission__HmacKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: queue-admission-hmac-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eventplatform-keyvault
