apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "media"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        # Sends the sidecar's own spans to the collector — see deploy/base/observability.
        dapr.io/config: "tracing"
    spec:
      containers:
        - name: media
          image: media-placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventplatform-config
          env:
            - name: ConnectionStrings__media-storage
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: media-storage-connection-string
            - name: Jwt__DevSigningKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: jwt-dev-signing-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eventplatform-keyvault
