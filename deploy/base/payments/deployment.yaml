apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: eventplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "payments"
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: "http"
        # Sends the sidecar's own spans to the collector — see deploy/base/observability.
        dapr.io/config: "tracing"
    spec:
      containers:
        - name: payments
          image: payments-placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventplatform-config
          env:
            - name: ConnectionStrings__payments
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: payments-connection-string
            - name: Jwt__DevSigningKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: jwt-dev-signing-key
            # Stripe credentials. Payments falls back to the simulator when these are
            # not real Stripe keys — see PaymentGatewayStartupLog, which logs at
            # Warning level when a deployed environment is not taking real payments.
            - name: Payments__Stripe__SecretKey
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: stripe-secret-key
            - name: Payments__Stripe__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: eventplatform-secrets
                  key: stripe-webhook-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eventplatform-keyvault
