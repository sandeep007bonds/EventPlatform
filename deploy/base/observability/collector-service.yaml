# The name every service's OTEL_EXPORTER_OTLP_ENDPOINT resolves to, and the endpoint the Dapr
# sidecars send their own spans to. ClusterIP: telemetry never leaves the cluster except through
# the collector's own outbound connection to Azure Monitor.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: eventplatform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: 4318
