apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Dapr components first: the services' sidecars resolve them by name at startup, and the Dapr
  # Configuration in observability/ is resolved the same way via each pod's dapr.io/config.
  - dapr-components
  - observability
  - catalog
  - inventory
  - ordering
  - payments
  - ticketing
  - communication
  - media
  - identity
  - queue
  - venue
  - gateway
  - frontend
