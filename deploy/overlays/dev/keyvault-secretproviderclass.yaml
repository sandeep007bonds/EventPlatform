apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eventplatform-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # From `terraform output aks_key_vault_secrets_provider_client_id` in
    # infra/environments/dev after apply — the AKS Key Vault Secrets
    # Provider add-on's own identity, not a separately-created one.
    userAssignedIdentityID: "REPLACE_ME_AKS_KV_SECRETS_PROVIDER_CLIENT_ID"
    # From `terraform output key_vault_name`.
    keyvaultName: "REPLACE_ME_KEY_VAULT_NAME"
    # From `terraform output aks_tenant_id`.
    tenantId: "REPLACE_ME_TENANT_ID"
    objects: |
      array:
        - |
          objectName: catalog-connection-string
          objectType: secret
        - |
          objectName: inventory-connection-string
          objectType: secret
        - |
          objectName: ordering-connection-string
          objectType: secret
        - |
          objectName: payments-connection-string
          objectType: secret
        - |
          objectName: ticketing-connection-string
          objectType: secret
        - |
          objectName: communication-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: media-storage-connection-string
          objectType: secret
        - |
          objectName: jwt-dev-signing-key
          objectType: secret
  # Mirrors the mounted secrets into a real Kubernetes Secret so Deployments
  # can use secretKeyRef/envFrom instead of reading the CSI volume directly —
  # this only gets created once some pod actually mounts this class (see each
  # Deployment's "secrets-store" volume), not merely by this class existing.
  secretObjects:
    - secretName: eventplatform-secrets
      type: Opaque
      data:
        - objectName: catalog-connection-string
          key: catalog-connection-string
        - objectName: inventory-connection-string
          key: inventory-connection-string
        - objectName: ordering-connection-string
          key: ordering-connection-string
        - objectName: payments-connection-string
          key: payments-connection-string
        - objectName: ticketing-connection-string
          key: ticketing-connection-string
        - objectName: communication-connection-string
          key: communication-connection-string
        - objectName: redis-connection-string
          key: redis-connection-string
        - objectName: media-storage-connection-string
          key: media-storage-connection-string
        - objectName: jwt-dev-signing-key
          key: jwt-dev-signing-key
