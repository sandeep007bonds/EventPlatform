apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eventplatform-keyvault
  annotations:
    # First thing in the sync, before anything that mounts it. Every migrate Job (wave -5) and
    # every Deployment (wave 0, the default) mounts this class as a CSI volume, and a pod whose
    # SecretProviderClass does not exist does not fail — it sits in ContainerCreating retrying
    # the mount forever, which looks like a stuck image pull rather than a missing resource.
    # Deliberately a normal resource at a wave, not a PreSync hook: hook resources default to
    # hook-delete-policy BeforeHookCreation, so making this one a hook would delete and recreate
    # it on every sync, out from under the pods already mounting it.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # From `terraform output aks_key_vault_secrets_provider_client_id` in
    # infra/environments/dev after apply — the AKS Key Vault Secrets
    # Provider add-on's own identity, not a separately-created one.
    userAssignedIdentityID: "8f983575-7783-43da-88da-cdb354925c26"
    # From `terraform output key_vault_name`.
    keyvaultName: "kv-epdev-3j13xu"
    # From `terraform output aks_tenant_id`.
    tenantId: "b727a530-a0d5-4fb8-bd40-d8f9763e97db"
    objects: |
      array:
        - |
          objectName: catalog-connection-string
          objectType: secret
        - |
          objectName: inventory-connection-string
          objectType: secret
        - |
          objectName: ordering-connection-string
          objectType: secret
        - |
          objectName: payments-connection-string
          objectType: secret
        - |
          objectName: ticketing-connection-string
          objectType: secret
        - |
          objectName: communication-connection-string
          objectType: secret
        - |
          objectName: identity-connection-string
          objectType: secret
        - |
          objectName: queue-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: redis-host
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: media-storage-connection-string
          objectType: secret
        - |
          objectName: jwt-dev-signing-key
          objectType: secret
        - |
          objectName: queue-admission-hmac-key
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: stripe-webhook-secret
          objectType: secret
  # Mirrors the mounted secrets into a real Kubernetes Secret so Deployments
  # can use secretKeyRef/envFrom instead of reading the CSI volume directly —
  # this only gets created once some pod actually mounts this class (see each
  # Deployment's "secrets-store" volume), not merely by this class existing.
  secretObjects:
    - secretName: eventplatform-secrets
      type: Opaque
      data:
        - objectName: catalog-connection-string
          key: catalog-connection-string
        - objectName: inventory-connection-string
          key: inventory-connection-string
        - objectName: ordering-connection-string
          key: ordering-connection-string
        - objectName: payments-connection-string
          key: payments-connection-string
        - objectName: ticketing-connection-string
          key: ticketing-connection-string
        - objectName: communication-connection-string
          key: communication-connection-string
        - objectName: identity-connection-string
          key: identity-connection-string
        - objectName: queue-connection-string
          key: queue-connection-string
        - objectName: redis-connection-string
          key: redis-connection-string
        - objectName: redis-host
          key: redis-host
        - objectName: redis-password
          key: redis-password
        - objectName: media-storage-connection-string
          key: media-storage-connection-string
        - objectName: jwt-dev-signing-key
          key: jwt-dev-signing-key
        - objectName: queue-admission-hmac-key
          key: queue-admission-hmac-key
        - objectName: appinsights-connection-string
          key: appinsights-connection-string
        - objectName: stripe-secret-key
          key: stripe-secret-key
        - objectName: stripe-webhook-secret
          key: stripe-webhook-secret
