# AKS secret store: Dapr's built-in Kubernetes secret store, reading native K8s
# Secrets in this namespace via the pod's service account — zero extra
# infrastructure. This is a bridge, not the documented target: ADR-0017
# deliberately deferred Key Vault CSI + Workload Identity wiring (the AKS
# cluster already has oidc_issuer_enabled/workload_identity_enabled set for
# exactly this future upgrade). Swap this component for the Key Vault CSI
# secret store later — service code never changes, only this file (same
# portability pattern the local secretstore.yaml documents).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.kubernetes
  version: v1
