# LOCAL DEV Dapr state store (Redis-backed). actorStateStore=true so Dapr
# Workflow (used by the checkout saga) can persist its state locally.
# In Azure this is replaced by an Azure Cache for Redis / Service Bus component.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6380
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
