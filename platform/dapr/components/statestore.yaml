# LOCAL DEV Dapr state store (Redis-backed). actorStateStore=true so Dapr
# Workflow (used by the checkout saga) can persist its state locally.
# The Azure counterpart is deploy/base/dapr-components/statestore.yaml — same component name,
# also Redis-backed, with the same actorStateStore=true (ADR-0017).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6380
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
