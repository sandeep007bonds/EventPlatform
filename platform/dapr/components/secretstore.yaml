# LOCAL DEV Dapr secret store (local JSON file). Copy secrets.local.example.json
# to secrets.local.json (git-ignored) and put local dummy secrets there.
# In Azure this is replaced by the Azure Key Vault secret store component.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    - name: secretsFile
      value: platform/dapr/secrets.local.json
    - name: nestedSeparator
      value: ":"
