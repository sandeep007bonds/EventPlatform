# LOCAL DEV Dapr pub/sub component (Redis-backed).
# Used via:  dapr run --resources-path platform/dapr ...
# The Azure counterpart is deploy/base/dapr-components/pubsub.yaml — same component NAME, so
# service code never changes, only the backing config does. It is Redis-backed rather than Service
# Bus: Service Bus stays the production target, dev diverges deliberately (ADR-0017).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6380
    - name: redisPassword
      value: ""
