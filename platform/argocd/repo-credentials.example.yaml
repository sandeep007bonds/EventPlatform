# Only needed if sandeep007bonds/EventPlatform is a PRIVATE repo - skip this
# entirely if it's public, Argo CD can clone a public repo with no credentials.
#
# Copy to repo-credentials.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f platform/argocd/repo-credentials.yaml
# Never commit repo-credentials.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: eventplatform-repo
  namespace: argocd
  labels:
    # This label, not the Secret's name, is what tells Argo CD to treat this
    # as a repository credential - Argo CD watches for it cluster-wide.
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/sandeep007bonds/EventPlatform.git
  username: replace-with-your-github-username
  password: replace-with-a-github-PAT-scoped-to-repo-read
