# Serves the built SPA. Two things here are load-bearing rather than boilerplate: the history
# fallback, and the split caching policy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cheap endpoint for the kubelet probes. Without it every probe renders and returns the whole
    # index.html, which works but is wasteful once probes run every 10s forever.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite fingerprints these filenames, so a given URL's content can never change — cache them
    # hard. This is where nearly all the bytes are.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # The router is client-side, so a deep link like /events/<id>/seats is not a file on disk.
        # Without this fallback the server 404s and the app never boots — it only ever works if
        # you enter through "/" and navigate. Refreshing any inner page would break it.
        try_files $uri $uri/ /index.html;

        # index.html must NOT be cached: it is the only file naming the current asset hashes. A
        # cached copy points a returning visitor at asset URLs the new deploy has already deleted,
        # and they get a blank page until they hard-refresh.
        add_header Cache-Control "no-cache";
    }
}
